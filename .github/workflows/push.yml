name: 每日推送
  on:
    schedule:
      - cron: '25 1 * * *'  # 北京时间 9:25 (UTC+8)
    workflow_dispatch:  # 允许手动触发

  jobs:
    push:
      runs-on: ubuntu-latest
      steps:
        - name: 签出代码
          uses: actions/checkout@v4

        - name: 设置Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: 安装依赖
          run: pip install requests

        - name: 执行推送
          env:
            PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
            NEWS_API_URL: http://42.193.14.76/api/news
          run: python push.py
